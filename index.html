const fireworks = []; let fwT = 0;
const dotTex = (()=>{ const c = document.createElement('canvas'); c.width = c.height = 32; const g = c.getContext('2d'); const gr = g.createRadialGradient(16,16,0,16,16,16); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.4,'rgba(255,255,255,.8)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0,0,32,32); return new T.CanvasTexture(c); })();
function spawnFirework(){
  const n = 80, pos = new Float32Array(n*3), vel = [];
  const a = rand(0,6.28), rr = rand(2,11), c = new T.Vector3(Math.cos(a)*rr, rand(9,14), Math.sin(a)*rr);
  for(let i=0;i<n;i++){ pos[i*3]=c.x; pos[i*3+1]=c.y; pos[i*3+2]=c.z; vel.push(new T.Vector3(rand(-1,1),rand(-1,1),rand(-1,1)).normalize().multiplyScalar(rand(5,8))); }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos,3));
  const m = new T.PointsMaterial({color:pick(['#FF7A8A','#FFD54D','#6FA8FF','#7ED957','#B48CFF','#FFFFFF','#FF9F5A']), size:.7, map:dotTex, transparent:true, depthWrite:false, blending:T.AdditiveBlending, fog:false});
  const pts = new T.Points(g, m); scene.add(pts); fireworks.push({pts, vel, life:1.8});
  if(mode==='island'){ tone(rand(70,110),.5,'sine',.12); tone(rand(900,1400),.15,'triangle',.02,.05); }
}
function updateFireworks(dt){
  if(festivalNow()){ fwT -= dt; if(fwT <= 0){ spawnFirework(); fwT = rand(.35,1.1); } }
  for(let i=fireworks.length-1;i>=0;i--){
    const f = fireworks[i], arr = f.pts.geometry.attributes.position.array; f.life -= dt;
    f.vel.forEach((v,j)=>{ v.y -= 3*dt; v.multiplyScalar(.975); arr[j*3]+=v.x*dt; arr[j*3+1]+=v.y*dt; arr[j*3+2]+=v.z*dt; });
    f.pts.geometry.attributes.position.needsUpdate = true; f.pts.material.opacity = clamp(f.life/1.2,0,1);
    if(f.life<=0){ scene.remove(f.pts); f.pts.geometry.dispose(); f.pts.material.dispose(); fireworks.splice(i,1); }
  }
}

/* ---------------- camera ---------------- */
const cam = {yaw:.6, pitch:.7, dist:25, target:new T.Vector3(0,0,0), goal:new T.Vector3(0,0,0)};
function placeCamera(){
  camera.position.set(cam.target.x + Math.sin(cam.yaw)*Math.cos(cam.pitch)*cam.dist, cam.target.y + Math.sin(cam.pitch)*cam.dist, cam.target.z + Math.cos(cam.yaw)*Math.cos(cam.pitch)*cam.dist);
  camera.lookAt(cam.target.x, cam.target.y+1, cam.target.z);
}
const pointers = new Map(); let dragMoved = false, pinchD = 0, downAt = null;
canvas.addEventListener('pointerdown', e=>{
  ac(); canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size===1){ dragMoved = false; downAt = {x:e.clientX, y:e.clientY}; }
  if(pointers.size===2){ const [a,b] = [...pointers.values()]; pinchD = Math.hypot(a.x-b.x, a.y-b.y); dragMoved = true; }
});
canvas.addEventListener('pointermove', e=>{
  const prev = pointers.get(e.pointerId); if(!prev) return;
  const cur = {x:e.clientX, y:e.clientY}; pointers.set(e.pointerId, cur);
  if(pointers.size===1){
    if(downAt && Math.hypot(cur.x-downAt.x, cur.y-downAt.y) > 7) dragMoved = true;
    if(dragMoved && mode==='island'){ cam.yawGoal = null; cam.pitchGoal = null; cam.yaw -= (cur.x-prev.x)*.008; cam.pitch = clamp(cam.pitch + (cur.y-prev.y)*.005, .35, 1.3); }
    if(dragMoved && mode==='room'){ roomYaw = clamp(roomYaw - (cur.x-prev.x)*.006, .15, 1.42); }
  } else if(pointers.size===2){
    const [a,b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchD>0 && mode==='island'){ cam.distGoal = null; cam.dist = clamp(cam.dist * pinchD/d, 12, camMax()); }
    pinchD = d;
  }
});
function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  const wasSingle = pointers.size===1; pointers.delete(e.pointerId);
  if(wasSingle && !dragMoved) onTap(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel', e=>{ e.preventDefault(); if(mode==='island'){ cam.distGoal = null; cam.dist = clamp(cam.dist * (1 + Math.sign(e.deltaY)*.1), 12, camMax()); } }, {passive:false});

const ray = new T.Raycaster(), ndc = new T.Vector2();
function onTap(x, y){
  if(pm.on || performance.now() - uiCloseT < 450 || $('#modalRoot').children.length) return;
  ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
  if(mode==='room'){ roomTap(); return; }
  ray.setFromCamera(ndc, camera);
  const objs = [...residents.filter(r=>r.p.root.visible).map(r=>r.p.hit), ...pets.filter(p=>p.p.root.visible).map(p=>p.p.hit), ...(visitor ? [visitor.p.hit] : []), ...Object.values(houses), ...Object.values(LOC_G), shopStand, ground];
  const hits = ray.intersectObjects(objs, true);
  for(const h of hits){
    let o = h.object; while(o && !o.userData.pick && o!==ground) o = o.parent;
    if(o===ground){ if(selected) closeSheet(); const pt = h.point; const d = Math.hypot(pt.x,pt.z); const k = d>12 ? 12/d : 1; cam.goal.set(pt.x*k,0,pt.z*k); return; }
    if(!o) continue;
    const pk = o.userData.pick;
    if(pk.type==='res'){ select(pk.r); return; }
    if(pk.type==='house'){ sfx.pop(); enterRoom(pk.r); return; }
    if(pk.type==='shop'){ sfx.pop(); openShop(); return; }
    if(pk.type==='loc'){ openLoc(pk.k); return; }
    if(pk.type==='visitor'){ sfx.pop(); openVisitor(); return; }
    if(pk.type==='pet'){ petSound(pk.pw.d.kind); openPetSheet(pk.pw); return; }
  }
}

/* ---------------- mini game: rock paper scissors ---------------- */
function openRPS(r){
  const st = {me:0, him:0, last:null, done:false};
  if(selected) closeSheet();
  cam.goal.copy(r.p.root.position);
  const talkTo = line => { r.say = line; r.spoken = line; speakWith(r.d.voice, line); };
  const draw = ()=>{
    const L = st.last, name = esc(r.d.name);
    const msg = st.done ? (st.me > st.him ? `你赢啦！${name} 叼给你 30 金币` : `${name} 赢啦！陪玩奖励 15 金币`) : L ? (L.res>0 ? '这一局你赢了！' : L.res<0 ? `这一局 ${name} 赢了` : '一样的！再来一次') : '三局两胜，伸出猫拳吧！';
    openModal(`<div class="modal-head"><h2>和${name}玩猫拳</h2><button class="toy close" data-close="1" style="margin-left:auto" aria-label="关闭">×</button></div>
      <div class="rps-board"><div class="side">你<div class="hand">${L ? HANDS[L.mine].e : '❔'}</div><div class="pts">${st.me}</div></div><div class="vs">VS</div><div class="side">${name}<div class="hand">${L ? HANDS[L.his].e : '❔'}</div><div class="pts">${st.him}</div></div></div>
      <div class="rps-msg">${msg}</div>
      ${st.done ? '<button class="toy big-go" data-close="1">好开心！</button>' : `<div class="rps-hands">${HANDS.map((h,i)=>`<button class="toy rps-btn" data-hand="${i}"><span>${h.e}</span>${h.n}</button>`).join('')}</div>`}`, b=>{
      if(!b || !b.dataset.hand || st.done) return;
      const mine = +b.dataset.hand, his = Math.floor(Math.random()*3);
      const res = mine===his ? 0 : ((mine+1)%3===his ? 1 : -1);
      if(res>0) st.me++; else if(res<0) st.him++;
      st.last = {mine, his, res}; sfx.pop();
      if(st.me>=2 || st.him>=2){
        st.done = true; const win = st.me > st.him;
        r.d.mood = clamp(r.d.mood+15,0,100);
        if(r.d.want && r.d.want.type==='play') fulfil(r, win?30:15); else addCoins(win?30:15);
        beHappy(r, win?'😆':'😝', 2); sfx.happy();
        talkTo((win ? '铲屎官好厉害呀！下次我一定赢' : '喵！我赢啦！再来玩哦') + '，' + r.d.catch);
      } else talkTo(res>0 ? '喵呜！' : res<0 ? '喵嘿嘿！' : '一样的！');
      draw();
    });
  };
  draw();
}

        w.use = it; w.dest = new T.Vector3(c.x + U.at[0]*Math.cos(a) + U.at[1]*Math.sin(a), 0, c.z - U.at[0]*Math.sin(a) + U.at[1]*Math.cos(a)); }

}

// adaptive resolution: a slow device draws fewer pixels instead of stuttering
const PR_MAX = Math.min(window.devicePixelRatio||1, 2); let prNow = PR_MAX, prT = 0, prSum = 0, prN = 0;
function adaptRes(real){
  if(document.hidden || real > .5) return; prSum += real; prN++; prT += real; if(prT < 2) return;

}
// on a struggling device the shadows are redrawn every third frame instead of every frame
let shadowSlow = false, shadowN = 0;

let pageBase = null;
async function pageHash(){

  const t = await r.text(); let h = 0; for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) | 0; return h + ':' + t.length;
}
async function checkUpdate(){

}

}

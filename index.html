<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#FF7A8A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="猫猫小岛"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>猫猫小岛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  --ink:#3B3355; --ink-soft:#6E6788; --panel:#FFFBF2; --panel-2:#FFF3DE; --line:#EADFCB;
  --coral:#FF7A8A; --coral-d:#D95466; --sun:#FFC94D; --sun-d:#D9A12A; --mint:#5CC9A7; --mint-d:#389C7E;
  --blue:#6FA8FF; --blue-d:#4A7FD6; --lilac:#B48CFF; --lilac-d:#8A63D6;
  --display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --body:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:#9EE3F5;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;touch-action:none;display:block;width:100%;height:100%}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* chunky toy buttons */
.toy{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.toy[disabled]{opacity:.45;pointer-events:none}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:12px 16px;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
.brand{background:var(--panel);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:6px 14px 8px}
.brand h1{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;letter-spacing:.04em;color:var(--coral-d)}
.brand .clock{font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;margin-top:2px}
.hud-right{display:flex;gap:8px;align-items:center}
.coins{display:flex;align-items:center;gap:6px;font-family:var(--display);font-size:22px;padding:6px 14px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:var(--sun);border:3px solid var(--sun-d);box-sizing:border-box;display:inline-block}
.icon-btn{width:48px;height:48px;font-size:22px;display:grid;place-items:center;padding:0;position:relative}
.time-ctl{display:flex;gap:6px;margin-top:6px}
.tbtn{font-size:14px;white-space:nowrap;min-width:38px;padding:2px 8px 3px;border:2px solid var(--ink);border-radius:10px;background:#fff;box-shadow:0 2px 0 var(--ink)}
.tbtn.on{background:var(--sun)}
#pauseBar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;background:var(--panel);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px;text-align:center;width:min(360px,calc(100% - 32px));box-sizing:border-box}
#pauseBar .credit{font-size:11px;opacity:.6;text-align:center}#pauseBar .credit a{color:inherit}
#pauseBar b{font-family:var(--display);font-weight:400;font-size:26px}
#restartAsk{display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--ink-soft)}
#restartAsk[hidden]{display:none}
.apt{background:linear-gradient(#FFE9D6,#FFD9C2);border:3px solid var(--ink);border-radius:18px;padding:10px 10px 0;display:flex;flex-direction:column;gap:8px}
.apt.night{background:linear-gradient(#3C3F7A,#2B2D5C)}
.apt-roof{text-align:center;font-family:var(--display);font-size:18px;background:#D95466;color:#fff;border-radius:12px;padding:4px}
.apt-floor{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border-bottom:4px solid #C98B62;padding-bottom:8px}
.apt-win{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:3px solid var(--ink);border-radius:12px;background:#BFE8FF;font-size:12px;min-width:0}
.apt.night .apt-win{background:#4A4E8A;color:#fff}
.apt.night .apt-win.lit{background:#FFD27A;color:var(--ink)}
.apt-win img{width:100%;max-width:64px;aspect-ratio:1;border-radius:10px;display:block}
.apt-name{font-family:var(--display);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.apt-st{font-size:10px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.apt-need{position:absolute;top:-10px;right:-6px;font-size:20px;background:#FFF0C9;border:2px solid var(--sun-d);border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.apt-door{text-align:center;font-size:28px;line-height:1}
@media (max-width:480px){.apt-floor{grid-template-columns:repeat(3,1fr)}}
.tv{background:#3B3355;border-radius:22px;padding:14px;border:3px solid var(--ink)}
.tv-screen{position:relative;background:linear-gradient(#9EE3F5,#E8FAFF);border-radius:14px;min-height:220px;overflow:hidden;display:flex;align-items:flex-end}
.tv-anchor{position:absolute;left:50%;top:10px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;border:4px solid #fff}
.tv-cap{position:relative;width:100%;background:rgba(59,51,85,.9);color:#fff;padding:10px 14px;font-size:17px;line-height:1.5;margin-top:170px}
.tv-cap small{display:block;font-size:12px;opacity:.8;color:#FFE066}
.tv-logo{position:absolute;top:10px;right:12px;background:#E8392F;color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px}
.sale{position:absolute;top:-10px;left:-6px;background:#E8392F;color:#fff;border:2px solid var(--ink);border-radius:99px;font-size:11px;padding:1px 7px}
.card{position:relative}
.dz-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.dz-grid{display:grid;grid-template-columns:repeat(16,1fr);width:min(320px,100%);aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;overflow:hidden;touch-action:none;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/20px 20px}
.dz-grid i{display:block;border:1px solid rgba(0,0,0,.06)}
.dz-side{display:flex;flex-direction:column;gap:10px;flex:1;min-width:160px}
.dz-pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.dz-pal button{aspect-ratio:1;border:3px solid var(--ink);border-radius:8px;padding:0}
.dz-pal button.on{outline:3px solid var(--coral);outline-offset:2px}
.tagbtn{cursor:pointer;font-family:var(--body)}
#inviteCard{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:12;background:#FFF0F4;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 32px);font-size:15px}
.dreambox{background:#FFF6D6;border:2px dashed var(--sun-d);border-radius:14px;padding:8px 12px;margin:-2px 0 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.dreambox .bar{height:10px}
.dream-how{color:var(--ink-soft);font-size:13px}.dream-done{color:var(--mint-d);font-weight:700}
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.book-cell{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:6px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;text-align:center}
.book-cell .ic{font-size:28px;line-height:1.2}.book-cell small{color:var(--ink-soft);font-size:10px}
.book-cell.off{background:#EFE6D6;color:var(--ink-soft);border-style:dashed}
.ft{display:flex;flex-direction:column;gap:14px}
.ft-unit{display:flex;flex-direction:column;align-items:center;gap:6px}
.ft-couple{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px}
.ft-link{font-size:20px}
.ft-kids{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;border-top:3px solid var(--line);padding-top:8px;position:relative}
.ft-kids::before{content:"";position:absolute;top:-14px;left:50%;width:3px;height:11px;background:var(--line)}
.ft-person{display:flex;flex-direction:column;align-items:center;font-size:12px;min-width:56px}
.ft-person img{width:48px;height:48px;border-radius:50%;border:2px solid var(--line)}
.ft-person small{color:var(--ink-soft);font-size:10px}
.ft-singles{display:flex;flex-wrap:wrap;gap:8px}
.pot{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:15px}
.card .row-btns{gap:4px}.card .pill-btn{padding:4px 8px;font-size:13px}
#updBar{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:35;background:#FFF6D6;border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-size:17px;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.mail-list{display:grid;gap:8px}
.mail{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;background:#FFFBF2;border:2.5px solid var(--ink);border-radius:14px;padding:8px 12px;cursor:pointer}
.mail .ic{font-size:26px}.mail small{display:block;color:#6E6788}.mail.new{background:#FFE3EA}
.letter{display:flex;gap:12px;align-items:flex-start;background:repeating-linear-gradient(#FFFDF6 0 30px,#F2E3C9 30px 31px);border:2.5px solid var(--ink);border-radius:14px;padding:14px}
.letter img{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;flex:none}
.letter-body p{margin:0;line-height:31px}.letter-body .sign{text-align:right;color:#6E6788}
.modal-bg.low{place-items:end center;background:transparent;pointer-events:none}.modal-bg.low .modal{pointer-events:auto;max-height:46vh;overflow:auto}
body.photo-on #hud,body.photo-on #dock,body.photo-on #toasts,body.photo-on #sheet,body.photo-on #pauseBar,body.photo-on #roomBar,body.photo-on #updBar{display:none!important}
#photoMode{position:fixed;inset:0;z-index:30;pointer-events:none}
.pm-layer{position:absolute;inset:0;pointer-events:none}.pm-layer.placing{pointer-events:auto;cursor:crosshair}
.pm-st{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;line-height:1;user-select:none}
.pm-frame{position:absolute;inset:0;pointer-events:none}.pm-frame.polaroid{border:14px solid #fff;border-bottom-width:46px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.1)}.pm-frame.heart{border:12px solid #FFB3C8}
.pm-bar{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 20px));box-sizing:border-box;background:rgba(255,251,242,.95);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;display:grid;gap:6px;pointer-events:auto}
.pm-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pm-sk{font-size:22px;width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:#fff;cursor:pointer;padding:0}.pm-sk.on{border-color:var(--ink);background:#FFE3EA}
.task-list{display:grid;gap:8px}.task{display:flex;gap:10px;align-items:center;background:#FFFBF2;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px}.task.off{opacity:.55}.task .ic{font-size:26px}.task .tx{flex:1;display:grid;gap:3px}.task small{color:#6E6788}.task .bar{display:block;height:8px;background:#EEE3D0;border-radius:6px;overflow:hidden}.task .bar i{display:block;height:100%;background:var(--coral)}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}.cal-day{background:#FFFBF2;border:2px solid var(--ink);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:2px;font-size:12px}.cal-day.today{background:#FFE3EA}.cal-day b{font-size:14px}.cal-day small{color:#6E6788}.cal-day .none{color:#A9A2BD}
.stall{margin-bottom:12px}.stall-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}.stall-head .face-dot{margin-top:0!important}.card.off{opacity:.5}
.crystal{text-align:center;padding:10px}.crystal .ball{width:130px;height:130px;margin:0 auto 12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#C9B6FF 40%,#7A5CD6);border:3px solid var(--ink);display:grid;place-items:center;font-size:54px;animation:orb 1.6s ease-in-out infinite;box-shadow:0 0 30px #B48CFF}.crystal .ball.done{animation:none;box-shadow:0 0 40px #FFD23F}@keyframes orb{50%{transform:scale(1.06);filter:hue-rotate(40deg)}}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--coral);border:2px solid var(--ink)}
.say{margin:10px 0 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 12px;font-size:15px;position:relative}
.want-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 12px;font-size:14px;color:var(--ink-soft)}
.pill-btn.hot{background:var(--sun)}
.news h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 8px}
.news ul{list-style:none;padding:0;margin:0 0 14px;display:flex;flex-direction:column;gap:8px}
.news li{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:15px}
.dream{background:linear-gradient(#3C3F7A,#6B5FA8);color:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;text-align:center}
.dream .dream-ic{font-size:40px;letter-spacing:6px}
.dream p{font-size:18px;line-height:1.6;margin:10px 0 0}
.dream .bonus{font-size:13px;opacity:.85}
.lvbox{background:#EADFFF;border:2px dashed var(--lilac-d);border-radius:14px;padding:8px 12px;margin:-2px 0 12px;font-size:15px}
.lvbox .want-acts{margin:8px 0 0}
.text-in{flex:1;min-width:0;font-family:var(--display);font-size:18px;padding:7px 12px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}
textarea.text-in{width:100%;box-sizing:border-box;min-height:100px;resize:vertical;font-size:17px;line-height:1.5}
.trait{display:grid;grid-template-columns:4.2em 1fr 4.2em;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.trait span:last-child{text-align:right}
.trait input{width:100%;accent-color:var(--coral)}
.pers-name{font-family:var(--display);font-size:18px;color:var(--coral-d);margin:2px 0 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.opts .toy{padding:12px 8px;font-size:17px}
.opts .big{font-size:34px;display:block;line-height:1.2}
.q-say{font-family:var(--display);font-size:20px;text-align:center;margin:6px 0 14px}
.sec{font-family:var(--display);font-size:17px;margin:12px 0 6px}
#karaoke{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(59,51,85,.9);color:#fff;border-radius:16px;padding:8px 18px;font-family:var(--display);font-size:22px;z-index:6;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;letter-spacing:.06em}
#karaoke .on{color:var(--sun)}
#karaoke small{display:block;font-size:13px;opacity:.8;letter-spacing:0}

#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:5;max-width:calc(100% - 32px)}
.dock-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px 6px;min-width:74px;font-size:15px}
.dock-btn .ic{font-size:30px;line-height:1}
.dock-btn.hot{background:var(--sun)}
@media (max-width:420px){.dock-btn{min-width:0;flex:1;padding:8px 6px 6px;font-size:14px}.dock-btn .ic{font-size:26px}#dock{gap:7px;width:calc(100% - 32px)}}

#toasts{position:fixed;top:calc(88px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:30;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;text-align:center}
.toast.gold{background:var(--sun)}
.toast.pink{background:#FFD3DA}
.toast.out{animation:fade .4s forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}

/* bottom sheet */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:520px;background:var(--panel);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);z-index:10;padding:14px 16px 16px;box-sizing:border-box;max-height:62%;overflow:auto;animation:rise .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes rise{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px}
.face-dot{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);flex:none;position:relative}
.face-dot::after{content:"";position:absolute;left:50%;top:-10px;width:30px;height:18px;transform:translateX(-50%);border-radius:30px 30px 6px 6px;background:var(--hair,#3B2A26)}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:2px solid var(--line);color:var(--ink-soft)}
.close{margin-left:auto;width:48px;height:48px;font-size:26px;border-radius:50%;padding:0;flex:none}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin:14px 0 10px;font-size:14px}
.bar{height:14px;border-radius:99px;background:#EFE6D6;border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar.mood i{background:var(--coral)} .bar.full i{background:var(--sun)} .bar.xp i{background:var(--lilac)}
.num{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:13px;min-width:28px;text-align:right}
.want{display:flex;align-items:center;gap:10px;background:#FFF0C9;border:2px dashed var(--sun-d);border-radius:14px;padding:8px 12px;font-size:15px;margin-bottom:12px}
.want .big{font-size:28px}
.want.none{background:var(--panel-2);border-color:var(--line);color:var(--ink-soft)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:14px}
.act .ic{font-size:24px;line-height:1}
.ed-tabs{margin-bottom:10px}.ed-tabs .tab{padding:4px 12px 6px;font-size:15px}
.act.c1{background:#FFE1B8}.act.c2{background:#FFD3DA}.act.c3{background:#D5F3E8}.act.c4{background:#DCE8FF}.act.c5{background:#EADFFF}
.chooser{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line)}
.chooser h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:18px}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;font-size:14px;position:relative}
.item .ic{font-size:32px;line-height:1.1}

let actx = null;
let audioOut = null;
function ac(){
  if(!actx){ try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    // soft master chain: gentle low-pass + compressor + a touch of room echo, so nothing sounds harsh
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200; lp.Q.value = .5;
    const comp = actx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3;
    const dl = actx.createDelay(); dl.delayTime.value = .09; const fb = actx.createGain(); fb.gain.value = .18; const wet = actx.createGain(); wet.gain.value = .16;
    lp.connect(comp); comp.connect(actx.destination);
    lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(comp);
    audioOut = lp;
  }catch(e){} }
  if(actx && actx.state==='suspended' && !document.hidden && document.hasFocus()) try{ actx.resume(); }catch(e){}
  return actx;
}
function tone(f, dur=.12, type='sine', vol=.12, when=0, glide=0){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f*glide), t+dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  o.connect(g); g.connect(audioOut || c.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur=.08, vol=.05, when=0, freq=1800){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + when, n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, n, c.sampleRate), ch = buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain(); src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 1.2; g.gain.value = vol;
  src.connect(bp); bp.connect(g); g.connect(audioOut || c.destination); src.start(t);
}

// Chinese voices on this device, best-sounding first (natural / online / enhanced voices beat the robotic ones)
let zhVoices = [];
const GOOD_VOICE = /natural|neural|online|enhanced|premium|高品质/i, CANTONESE = /yue|HK|粤|粵/i;
function loadVoices(){
  if(!window.speechSynthesis) return;
  const zh = speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang) || /Chinese|中文|普通话|國語/i.test(v.name));
  const score = v => (GOOD_VOICE.test(v.name) ? 0 : 10) + (/zh[-_]CN|cmn/i.test(v.lang) ? 0 : 3) + (CANTONESE.test(v.lang + v.name) ? 5 : 0);
  zhVoices = zh.sort((a,b)=>score(a)-score(b));
}

  if(key) return VOICE_CN[key];
  const n = v.name.replace(/Microsoft|Google|Apple|Online|Natural|Enhanced|Premium|\(.*?\)|- ?Chinese.*$/gi,' ').replace(/\s+/g,' ').trim();

// known male voices (Microsoft / Edge neural / Apple); everything else is treated as female, which most Chinese voices are
const MALE_VOICE = /kangkang|yunxi|yunjian|yunyang|yunxia|yunfeng|yunhao|yunye|yunze|yunjie|yunhan|liang|\bmale\b|男/i;

function voicesFor(g){ const m = zhVoices.filter(v=>voiceGender(v)===g); return m; }
function pickVoice(voice){
  if(!zhVoices.length) return null;
  const g = (voice && voice.g) || 'f';
  if(voice && voice.name){ const v = zhVoices.find(x=>x.name===voice.name); if(v && voiceGender(v)===g) return v; }
  // no explicit choice: spread residents over the good Mandarin voices of their gender by their voice seed
  const mand = zhVoices.filter(v=>!CANTONESE.test(v.lang + v.name));
  let pool = mand.filter(v=>voiceGender(v)===g);
  if(!pool.length) pool = mand.length ? mand : zhVoices; // no voice of that gender on this device: fall back, natPitch shifts it
  const best = pool.filter(v=>GOOD_VOICE.test(v.name)), use = best.length >= 2 ? best : pool;

function applyCatPose(c, p, dt){
  const B = c.B, R = c.ref, reach = c.reach.F;
  c.lift.rotation.set(0, p.yaw || 0, p.roll || 0, 'YXZ'); c.lift.position.x = (p.x||0); c.lift.position.z = (p.z||0);
  c.root.updateMatrixWorld(true);
  if(p.walk){ // the model's own walk cycle drives the bones
    c.walkAct.play(); c.walkAct.timeScale = .9*(c.walkRate || 1); c.mixer.update(dt); c.inner.updateMatrixWorld(true);
  } else { c.walkAct.stop(); catResetBones(c); }
  c.lift.getWorldQuaternion(c.qRoot);
  rotPYR(c, B.torso, ...p.body);
  rotPYR(c, B.spine01, ...p.sp1); rotPYR(c, B.spine02, ...p.sp2);
  rotPYR(c, B.neck, ...p.neck); rotPYR(c, B.head, ...p.head);
  // tail: base angle, curl spread along the chain, travelling wave
  const tb = [B.tail, B.tail01, B.tail02, B.tail03, B.tailend];
  rotPYR(c, B.tail, p.tail[0], p.tail[1], p.tail[2]);
  const [wp, wa, wf] = p.tailWave, T0 = c.anim ? c.anim.t : 0;
  tb.forEach((b,i)=>{ if(i===0) return; rotCat(c, b, CAT_AX.y, (p.tailCurl||0)*.35 + S_(T0*wf - i*.7)*wa); rotCat(c, b, CAT_AX.x, wp + (p.puff ? -.12*p.puff : 0)); });
  // ears, mouth, eyes
  const ef = p.earsFlat || 0;
  [[B.earL, 1], [B.earR, -1]].forEach(([e, s])=>{ if(c.L.earFold) rotCat(c, e, CAT_AX.x, 1.25); rotPYR(c, e, p.ears[0] + ef*.7, (p.ears[1] + ef*.5)*s, -ef*.5*s); });
  // the model's own jaw barely opens, so the cartoon mouth decal does the talking
  const mo = Math.max(p.mouth||0, p.smile||0);
  if(c.mouthMesh){ const open = mo > .08; c.mouthMesh.material = open ? CAT_MOUTH_MAT : CAT_SMILE_MAT;
    c.mouthMesh.scale.set(open ? .75 + .25*Math.min(1, mo*1.5) : .8, open ? Math.min(1, mo*1.15) : .8, 1); }
  const bl = Math.min(1, Math.max(-.3, p.blink||0)); [B.eyeL, B.eyeR].forEach(e=>{ e.scale.set(1 + Math.max(0,-bl)*.25, 1 - Math.max(0,bl)*.85, 1 + Math.max(0,-bl)*.25); });
  if(c.eyes) c.eyes.forEach(e=>{ const shut = bl > .7, o = 1 + Math.max(0,-bl)*.15, k = shut ? 1 : 1 - Math.max(0,bl)*.9/.7*.7;
    e.material = shut ? CAT_EYE_SHUT : e.userData.open; e.scale.set(o, o*k, o); e.position.y = shut ? 0 : -Math.max(0,bl)*.07; });
  // legs: IK in body space. Sitting / lying lowers the floor to the hips and tucks feet in.
  if(!p.walk){
    const hipD = p.hipDrop||0, frD = p.frontDrop||0, bum = reach*.42;
    const floor = R.floor + hipD*Math.max(0, R.hp.y - R.floor - bum);
    for(const k in c.legs){
      const lg = c.legs[k], front = k[0]==='F', base = catLocal(c, lg.chain[0], new T.Vector3());
      const tgt = new T.Vector3(base.x, floor + reach*.05, base.z);
      // folded legs tuck up under the joint; the body then settles onto the ground
      if(front && frD){ tgt.y += (R.belly + reach*.1 - tgt.y)*frD; tgt.z -= reach*.12*frD; }
      if(!front && hipD) tgt.y = Math.max(tgt.y, R.belly + reach*.1);
      const off = p.legs[k]; tgt.x += off[0]*reach; tgt.y += off[1]*reach; tgt.z += off[2]*reach;
      // a paw can be sent to the mouth (grooming), blended by pawToMouth
      if(p.pawToMouth && p.pawToMouth[k] && c.mouthMesh){ c.mouthMesh.parent.updateMatrixWorld(true);
        const mo = catLocal(c, c.mouthMesh, new T.Vector3()); mo.y -= reach*.18; mo.z -= reach*.05; mo.x *= .5; tgt.lerp(mo, p.pawToMouth[k]); }
      legIK(c, lg.chain, lg.end, tgt, p.pawToMouth ? 16 : 10);
      setFoot(c, k, p.footP[k]||0);
    }
  }
  // set down on the ground
  c.lift.position.y = 0; c.root.updateMatrixWorld(true);
  const lo = catLowest(c, p.lie), want = -lo + (p.lift||0)*c.size;
  c.ground = (c.ground===null || Math.abs(c.ground - want) > .5*c.size) ? want : c.ground + (want - c.ground)*Math.min(1, dt*14);
  c.lift.position.y = c.ground; c.root.updateMatrixWorld(true);
  const U = c.mesh.material.userData.U; U.uFur.value = (c.L.fur||0) + (p.puff||0)*.9; U.uTailFluff.value = (c.L.tailFluff||1) + (p.puff||0)*2;
}

const CAT_FACES = {};
function makeCatAnimator(c){
  const A = {clip:'idle', t:0, faceOver:null, blendT:1, from:null,
    play(name){ if(name===A.clip) return; A.from = snapshot(c); A.blendT = 0; A.clip = name; A.t = 0; },
    update(dt){
      A.t += dt; const p = poseBase(); (CAT_CLIPS[A.clip] || CAT_CLIPS.idle)(A.t, p, c);
      if(A.faceOver==='happy'){ p.blink = Math.max(p.blink, .85); p.smile = Math.max(p.smile||0, .5); }
      if(A.faceOver==='sad'){ p.ears[0] += .4; p.blink = Math.max(p.blink, .35); p.tail[0] += .5; }
      applyCatPose(c, p, dt);
      if(A.from && A.blendT < 1){ A.blendT = Math.min(1, A.blendT + dt/.35); const w = ss(0,1,A.blendT); for(const k in c.B){ const b = c.B[k]; const q = A.from.q[k]; b.quaternion.copy(q.clone().slerp(b.quaternion, w)); } c.lift.position.y = A.from.y + (c.lift.position.y - A.from.y)*w; c.root.updateMatrixWorld(true); }
    }};
  function snapshot(c){ const q = {}; for(const k in c.B) q[k] = c.B[k].quaternion.clone(); return {q, y:c.lift.position.y}; }
  c.anim = A; return A;
}

// merge static decoration into one mesh per material: hundreds of trees become a few draw calls
const STATIC = [];
function mergeStatic(){
  if(!STATIC.length) return;
  const byMat = new Map();
  STATIC.splice(0).forEach(o=>{
    o.updateMatrixWorld(true);
    o.traverse(m=>{ if(!m.isMesh) return;
      const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()); g.applyMatrix4(m.matrixWorld);
      const k = m.material.uuid + (m.castShadow ? 's' : '');
      if(!byMat.has(k)) byMat.set(k, {mat:m.material, cast:m.castShadow, geos:[]}); byMat.get(k).geos.push(g); });
    if(o.parent) o.parent.remove(o);
  });
  byMat.forEach(({mat, cast, geos})=>{
    let n = 0; geos.forEach(g=>n += g.attributes.position.count);
    const pos = new Float32Array(n*3), nor = new Float32Array(n*3); let off = 0;
    geos.forEach(g=>{ pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); off += g.attributes.position.count; g.dispose(); });
    const mg = new T.BufferGeometry(); mg.setAttribute('position', new T.BufferAttribute(pos,3)); mg.setAttribute('normal', new T.BufferAttribute(nor,3)); mg.computeBoundingSphere();
    const mm = new T.Mesh(mg, mat); mm.castShadow = cast; mm.receiveShadow = true; scene.add(mm);
  });
}
function mergeLocal(group){
  const byMat = new Map(), keep = [];
  group.children.slice().forEach(m=>{
    if(!m.isMesh || m.isSkinnedMesh || m.userData.noMerge || m.material.map || m.material.transparent || Array.isArray(m.material)){ keep.push(m); return; }
    m.updateMatrix(); const g = (m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone()); g.applyMatrix4(m.matrix);
    const k = m.material.uuid + (m.castShadow ? 's' : '');
    if(!byMat.has(k)) byMat.set(k, {mat:m.material, cast:m.castShadow, geos:[]}); byMat.get(k).geos.push(g); group.remove(m);
  });
  byMat.forEach(({mat, cast, geos})=>{
    let n = 0; geos.forEach(g=>n += g.attributes.position.count);
    const pos = new Float32Array(n*3), nor = new Float32Array(n*3); let off = 0;
    geos.forEach(g=>{ pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); off += g.attributes.position.count; g.dispose(); });
    const mg = new T.BufferGeometry(); mg.setAttribute('position', new T.BufferAttribute(pos,3)); mg.setAttribute('normal', new T.BufferAttribute(nor,3)); mg.computeBoundingSphere();
    const mm = new T.Mesh(mg, mat); mm.castShadow = cast; mm.receiveShadow = true; group.add(mm);
  });
  return group;
}

function buildHair(look){
  const g = new T.Group(), c = look.hairColor, m = M(c, true);
  const cap = (tilt=-.35, len=Math.PI*.55, r=.67) => { const h = new T.Mesh(new T.SphereGeometry(r,24,16,0,Math.PI*2,0,len), m); h.rotation.x = tilt; h.castShadow = true; return h; };
  const onSphere = (pol, az, r) => new T.Vector3(Math.sin(pol)*Math.cos(az)*r, Math.cos(pol)*r, Math.sin(pol)*Math.sin(az)*r);
  switch(look.hair){
    case 'spiky': {
      g.add(cap(-.3));
      for(let i=0;i<7;i++){ const az = i/7*Math.PI*2, dir = onSphere(.55, az, 1).applyAxisAngle(new T.Vector3(1,0,0),-.3);
        const cn = new T.Mesh(G.cone(.17,.45,8), m); cn.position.copy(dir.clone().multiplyScalar(.66)); cn.quaternion.setFromUnitVectors(new T.Vector3(0,1,0), dir); g.add(cn); }
      const topc = new T.Mesh(G.cone(.18,.5,8), m); topc.position.set(0,.8,-.1); g.add(topc);
      break; }
    case 'buns':
      g.add(cap(-.3));
      [-1,1].forEach(s=>{ const b = new T.Mesh(G.sph(.26), m); b.position.set(s*.5,.45,-.12); b.castShadow = true; g.add(b); });
      break;
    case 'long': {
      g.add(cap(-.22));
      const back = new T.Mesh(new T.CylinderGeometry(.62,.72,1.0,24,1,true,Math.PI/2,Math.PI), m); back.position.set(0,-.4,-.02); g.add(back);
      break; }

function boxGoal(r){

  const p = r.p.root.position; let best = null, bd = 9;
  boxes.forEach(b=>{ const d = Math.hypot(b.x-p.x, b.z-p.z); if(d < bd){ bd = d; best = b; } });

  if(b.cat && b.cat !== r && b.cat.state==='box'){   // somebody got there first
    const o = b.cat; r.box = null;

function buildCatChar(look, acc, outfit, opts){
  const root = new T.Group(), L = catLookFull(look), kitten = !!(opts && opts.kitten);
  // the rest of the game reads skin / hair / shirt colours for houses, portraits and dots: keep them in step with the coat
  look.skin = L.base; look.hairColor = L.pat==='calico' ? L.patC : L.patC || L.base; if(!look.shirt) look.shirt = pick(SHIRTS);
  const c = buildCat(L, {age: kitten ? .5 : 1}); c.root.scale.setScalar(CAT_K); root.add(c.root);
  makeCatAnimator(c); c.anim.t = Math.random()*4; c.anim.update(.001);
  // a head frame that rides on the head bone: origin at the head centre, y up, sized like a human head (r .62)
  root.updateMatrixWorld(true);
  const hs = catHeadSphere(c), head = new T.Object3D(), k = hs.r/.62*.9;
  const want = new T.Matrix4().compose(hs.c.clone().add(new T.Vector3(0, hs.r*.08, 0)), root.getWorldQuaternion(new T.Quaternion()), new T.Vector3(k,k,k));
  head.matrixAutoUpdate = false; head.matrix.copy(new T.Matrix4().copy(c.B.head.matrixWorld).invert().multiply(want)); c.B.head.add(head);
  const rig = new T.Group(), mouth = new T.Group(), arms = [new T.Group(), new T.Group()], legs = [new T.Group(), new T.Group()];
  const accSlot = new T.Group(); head.add(accSlot); accSlot.add(buildAcc(acc)); accSlot.scale.setScalar(.95);
  catCostume(c, head, outfit || 'tee');
  // costume: a little collar with a bell on every cat, the outfit's colour if it has one
  const top = (hs.c.y + hs.r*1.45)/1;
  const hit = new T.Mesh(G.cyl(.75,.75,top+.2,8), new T.MeshBasicMaterial({visible:false})); hit.position.y = (top+.2)/2; root.add(hit);
  root.add(blobShadow(.55*(L.size||1)));
  return {root, rig, head, arms, legs, mouth, eyes:[], accSlot, hit, cat:c, isCat:true, kitten, top, headY:hs.c.y, labelY:top + .32, bubbleY:top + 1.05};
}
/* ---------------- cat costumes: small things a cat can wear, riding on the bones ---------------- */
function catAnchor(c, bone, pos, rot, sc){
  const sk = c.mesh.skeleton, bi = sk.bones.indexOf(c.B[bone]);
  const A = new T.Matrix4().multiplyMatrices(sk.boneInverses[bi], c.mesh.bindMatrix);
  const o = new T.Object3D(); o.matrixAutoUpdate = false;
  o.matrix.copy(A).multiply(new T.Matrix4().compose(new T.Vector3(...pos), new T.Quaternion().setFromEuler(new T.Euler(...(rot||[0,0,0]))), new T.Vector3(sc||1, sc||1, sc||1)));
  c.B[bone].add(o); return o;
}
function catCostume(c, H, O){
  const CM = (col, o)=>new T.MeshToonMaterial(Object.assign({color:col, gradientMap:GRAD}, o||{}));
  const cm = (g, m, x=0, y=0, z=0)=>{ const o = new T.Mesh(g, m); o.position.set(x,y,z); return o; };
  const NECK = [0, 1.85, 1.15], NECK_R = [Math.PI/2 - .9, 0, 0], NR = .8, CHIN = [0, 1.42, 1.98];
  const neck = ()=>catAnchor(c, 'neck', NECK, NECK_R);
  const ring = (col, tube)=>{ const n = neck(); n.add(cm(new T.TorusGeometry(NR, tube, 8, 30), CM(col))); return n; };
  const chin = (rx)=>catAnchor(c, 'neck', CHIN, [rx || .35, 0, 0]);
  if(O==='tee'){ ring('#E8434F', .1); chin().add(cm(new T.SphereGeometry(.2, 12, 10), CM('#FFD23F'))); }
  if(O==='suit'){ ring('#2F2B45', .06); const b = chin(); [-1,1].forEach(s=>{ const w = cm(new T.ConeGeometry(.24, .44, 4), CM('#2F2B45'), s*.22, 0, 0); w.rotation.z = s*Math.PI/2; b.add(w); }); b.add(cm(new T.SphereGeometry(.11, 8, 6), CM('#2F2B45'))); }
  if(O==='overalls'){ ring('#4A7FD6', .09); const b = chin(.2); const t = cm(new T.ConeGeometry(.5, .8, 3), CM('#4A7FD6'), 0, -.1, -.05); t.rotation.set(Math.PI, 0, 0); t.scale.z = .3; b.add(t); [[-.15,.1],[.18,0],[0,-.2]].forEach(([x,y])=>b.add(cm(new T.SphereGeometry(.045, 6, 5), CM('#FFFFFF'), x, y, .1))); }
  if(O==='kimono'){ ring('#E8434F', .17); const b = chin(); [-1,1].forEach(s=>{ const w = cm(new T.SphereGeometry(.2, 10, 8), CM('#E8434F'), s*.22, 0, 0); w.scale.set(1.2, .7, .5); b.add(w); }); b.add(cm(new T.SphereGeometry(.1, 8, 6), CM('#FFD23F'))); }
  if(O==='dress'){ ring('#FFFFFF', .07); const b = chin(.1); b.add(cm(new T.CircleGeometry(.55, 24, Math.PI, Math.PI), CM('#FF9AB8', {side:T.DoubleSide}), 0, .15, -.05)); for(let i=0;i<9;i++){ const a = Math.PI + i/8*Math.PI; b.add(cm(new T.SphereGeometry(.07, 6, 5), CM('#FFFFFF'), Math.cos(a)*.55, .15 + Math.sin(a)*.55, 0)); } }
  if(O==='hoodie'){ const cp = catAnchor(c, 'spine01', [0, 1.5, -.2]); const cape = cm(new T.CylinderGeometry(1.22, 1.22, 2.1, 22, 1, true, Math.PI/2 + .3, Math.PI - .6), CM('#6A4CC9', {side:T.DoubleSide})); cape.rotation.x = Math.PI/2; cp.add(cape); ring('#FFD23F', .08); }
  if(O==='pajamas'){ const cap = cm(new T.ConeGeometry(.42, .95, 16), CM('#B9C8FF'), .12, .9, -.05); cap.rotation.z = -.45; H.add(cap); H.add(cm(new T.SphereGeometry(.1, 8, 6), CM('#FFFFFF'), .52, 1.25, -.05)); }
  if(O==='chef'){ H.add(cm(new T.CylinderGeometry(.36, .33, .36, 20), CM('#FFFFFF'), 0, .74, -.04)); const puff = cm(new T.SphereGeometry(.44, 18, 12), CM('#FFFFFF'), 0, 1.0, -.04); puff.scale.y = .62; H.add(puff); }
  if(O==='princess'){ const veil = new T.Mesh(new T.ConeGeometry(.75, 1.6, 20, 1, true), new T.MeshBasicMaterial({color:'#FFFFFF', transparent:true, opacity:.55, side:T.DoubleSide, depthWrite:false})); veil.position.set(0, .05, -.45); veil.rotation.x = -.5; H.add(veil); for(let i=0;i<5;i++){ const a = i/5*Math.PI*2; H.add(cm(new T.SphereGeometry(.08, 6, 5), CM(i%2 ? '#FF8FB1' : '#FFFFFF'), Math.cos(a)*.3, .66, Math.sin(a)*.3 - .1)); } }
  if(O==='dino'){ const hood = cm(new T.SphereGeometry(.7, 18, 12, 0, Math.PI*2, 0, Math.PI*.55), CM('#7ED957'), 0, .02, -.1); hood.rotation.x = -.35; H.add(hood); [[.66,-.05],[.5,-.42],[.18,-.64]].forEach(([y,z])=>{ const cn = cm(new T.ConeGeometry(.1, .24, 6), CM('#FFC94D'), 0, y, z); cn.rotation.x = -Math.atan2(z,y)*.9; H.add(cn); });
    [['spine02',[0, 2.35, .6]],['spine01',[0, 2.3, -.1]],['torso',[0, 2.25, -.85]],['torso',[0, 2.0, -1.5]]].forEach(([b, pos])=>{ catAnchor(c, b, pos).add(cm(new T.ConeGeometry(.16, .4, 6), CM('#FFC94D'), 0, .1, 0)); }); }
  if(O==='astronaut'){ H.add(new T.Mesh(new T.SphereGeometry(1.05, 24, 16), new T.MeshBasicMaterial({color:'#BFEFFF', transparent:true, opacity:.22, depthWrite:false}))); ring('#DCD6E8', .14); }
}
function buildChar(look, acc, outfit, opts, kitten){
  return look && look.cat ? buildCatChar(look, acc, outfit, {kitten}) : buildHumanChar(look, acc, outfit, opts);
}
function setAcc(parts, acc){ parts.accSlot.clear(); parts.accSlot.add(buildAcc(acc)); parts.accSlot.traverse(o=>{ if(o.isMesh) o.castShadow = true; }); }

  const h = new T.Group(), hs = houseStyleOf(r), wall = hs.wall, roofC = hs.roof;

    [-1,1].forEach(sx=>{ h.add(mesh(G.box(.14,2.2,.14), M('#8A5A3C'), sx*1.45,1.1,1.4)); h.add(mesh(G.box(.14,2.2,.14), M('#8A5A3C'), sx*1.45,1.1,-1.4)); });

    [-1,1].forEach(sx=>{ const p = mesh(G.box(3.4,.18,2.05), M(roofC), sx*.0,0,0); p.position.set(0, 3.0, sx*.72); p.rotation.x = sx*.72; h.add(p); });
    const gg = new T.CylinderGeometry(1.62,1.62,2.9,3); gg.rotateX(-Math.PI/2); gg.rotateY(Math.PI/2); const gab = mesh(gg, M(wall), 0,2.65,0); gab.scale.y = .56; h.add(gab);

    const win = mesh(G.cyl(.32,.32,.08,16), windowMat, 0,2.75,1.0, false); win.rotation.x = Math.PI/2; h.add(win);
    h.add(mesh(G.box(.36,1.0,.36), M('#B0A8A0'), -.9,3.5,-.5));
    signY = 4.6;
  } else {
    h.add(mesh(G.box(3.2,2.4,3.0), M(wall), 0,1.2,0));
    const roof = mesh(G.cone(2.7,1.9,4), M(roofC), 0,3.35,0); roof.rotation.y = Math.PI/4; h.add(roof);
    h.add(mesh(G.box(.95,1.5,.1), M('#9A6B4A'), 0,.75,1.52));
    h.add(mesh(G.sph(.06,6,4), M('#FFD23F'), .3,.75,1.6));
    [-1,1].forEach(sx=>{ const w = mesh(G.box(.62,.62,.08), windowMat, sx*1.05,1.45,1.52, false); h.add(w); h.add(mesh(G.box(.7,.08,.12), M(roofC), sx*1.05,1.1,1.55)); });
    h.add(mesh(G.box(.4,.9,.4), M('#D98E73'), .8,3.6,-.4));
  }
  h.add(mesh(G.cyl(.9,.9,.08,20), M('#EFD29C'), 0,.04,2.1));
  if(hs.garden){
    [-1,1].forEach(sx=>{
      for(let i=0;i<4;i++) h.add(mesh(G.box(.1,.5,.1), M('#FFFFFF'), sx*(1.0 + i*.32),.25,2.75));
      h.add(mesh(G.box(1.1,.07,.06), M('#FFFFFF'), sx*1.48,.38,2.75));
      for(let i=0;i<3;i++){ const fx = sx*(1.1 + i*.3), c = ['#FF7A8A','#FFC94D','#B48CFF'][(i + (sx>0?1:0))%3];

    });

  }

  mergeLocal(h);
  h.position.set(s.x,0,s.z); h.rotation.y = Math.atan2(-s.x,-s.z);
  h.userData.pick = {type:'house', r};
  scene.add(h); houses[r.d.slot] = h;
}

/* ---------------- particles ---------------- */
const parts = [];
function burst(scn, pos, emoji, n=6, spread=.8){
  for(let i=0;i<n;i++){
    const s = sprite(bubbleTexPlain(emoji), .55, .55); s.position.copy(pos).add(new T.Vector3(rand(-spread,spread), rand(0,.4), rand(-spread,spread)));
    scn.add(s); parts.push({s, scn, v:new T.Vector3(rand(-.4,.4), rand(1.2,2.2), rand(-.4,.4)), life:1.4+Math.random()*.4, max:1.8});
  }
}
function bubbleTexPlain(emoji){ const k='P'+emoji; if(texCache[k]) return texCache[k]; const c=document.createElement('canvas'); c.width=c.height=96; const g=c.getContext('2d'); g.font='72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(emoji,48,54); return texCache[k]=new T.CanvasTexture(c); }
const CONF_COLS = ['#FF7A8A','#FFC94D','#5CC9A7','#6FA8FF','#B48CFF'];
function confetti(scn, pos){
  for(let i=0;i<40;i++){
    const m = mesh(new T.PlaneGeometry(.18,.28), new T.MeshBasicMaterial({color:pick(CONF_COLS), side:T.DoubleSide, transparent:true}), pos.x, pos.y+2.5, pos.z, false);
    scn.add(m); parts.push({m, scn, v:new T.Vector3(rand(-3,3), rand(3,6), rand(-3,3)), life:2.2, max:2.2, spin:rand(3,9)});
  }
}
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i]; p.life -= dt; const o = p.s || p.m;
    if(p.s){ o.position.addScaledVector(p.v, dt); p.v.multiplyScalar(.97); o.material.opacity = clamp(p.life/.6,0,1); }
    else { p.v.y -= 9*dt; o.position.addScaledVector(p.v, dt); o.rotation.x += p.spin*dt; o.rotation.y += p.spin*.7*dt; o.material.opacity = clamp(p.life/.5,0,1); }
    if(p.life<=0){ p.scn.remove(o); if(p.m){ o.geometry.dispose(); o.material.dispose(); } else o.material.dispose(); parts.splice(i,1); }
  }
}

const EXCL = [{x:0,z:0,r:2.9},{x:6.8,z:-4.2,r:2.1},{x:0,z:-7,r:1.6}];
Object.values(LOCS).forEach(l=>{ if(l.r) EXCL.push({x:l.x, z:l.z, r:l.r}); });
// push out of obstacles and slide around them toward dest
function avoidObstacles(pos, dest, step){
  for(const e of EXCL){
    if(Math.hypot(dest.x-e.x, dest.z-e.z) < e.r) continue; // heading inside (e.g. onto the stage)
    const ex = pos.x-e.x, ez = pos.z-e.z, ed = Math.hypot(ex,ez) || .001;
    if(ed < e.r){
      pos.x = e.x + ex/ed*e.r; pos.z = e.z + ez/ed*e.r;
      const tx = -ez/ed, tz = ex/ed, dir = ((dest.x-pos.x)*tx + (dest.z-pos.z)*tz) >= 0 ? 1 : -1;
      pos.x += tx*dir*step; pos.z += tz*dir*step;
    }
  }
}
function randomSpot(){
  for(let k=0;k<30;k++){
    const a = rand(0,6.28), r = rand(3.4, S && S.isleLevel ? isleR - 3 : 11.2), x = Math.cos(a)*r, z = Math.sin(a)*r;
    if(EXCL.some(e=>Math.hypot(e.x-x,e.z-z)<e.r+.4)) continue;
    if(SLOTS.some(s=>Math.hypot(s.x-x,s.z-z)<3.1)) continue;
    return new T.Vector3(x,0,z);
  }
  return new T.Vector3(4,0,4);
}

// Kitten genetics: every trait comes from one parent, with a little mutation. Long hair, folded ears and
// colourpoint are recessive: a kitten shows them only when it gets the hidden copy from both parents.
// Calico and tortoiseshell need two X chromosomes, so they are (almost) always girls.
const RECESSIVE = ['long','fold','point'];

function passAllele(L, k){ return hasTrait(L, k) ? 1 : (L.carry && L.carry[k]) ? (Math.random() < .5 ? 1 : 0) : 0; }
const DARK_COATS = ['black','brown','choco','blue','silver'];
function catChild(A, B, g){
  const P = ()=>Math.random() < .5 ? A : B, mixed = A.breed !== B.breed;
  const L = {cat:1, breed:P().breed, coat:P().coat, pat:P().pat, white:P().white ?? 0, eye:P().eye, odd:null,
    long:false, ear:P().ear==='fold' ? 'up' : P().ear, tail:P().tail, eyeShape:P().eyeShape || 'normal', nose:P().nose || null,
    fat:clamp(Math.round(((A.fat ?? 4) + (B.fat ?? 4))/2 + rand(-1.4,1.4)), 0, 8), size:clamp(Math.round(((A.size ?? 4) + (B.size ?? 4))/2 + rand(-1.4,1.4)), 0, 8), carry:{}};
  if(mixed) L.mix = [A.mix ? A.mix.join('×') : CAT_BREEDS[A.breed].name, B.mix ? B.mix.join('×') : CAT_BREEDS[B.breed].name];
  else if(A.mix) L.mix = A.mix.slice();
  // orange + a dark coat can mix into tortoiseshell (or calico with white) on a girl
  const orange = [A, B].some(x=>x.coat==='orange' || x.pat==='calico' || x.pat==='tortie'), dark = [A, B].some(x=>DARK_COATS.includes(x.coat) || x.pat==='calico' || x.pat==='tortie');
  if(g==='f' && orange && dark && Math.random() < .45){ L.pat = L.white ? 'calico' : 'tortie'; L.coat = pick(DARK_COATS.filter(c=>c===A.coat || c===B.coat).concat(['black'])); }
  if((L.pat==='calico' || L.pat==='tortie') && g==='m' && Math.random() < .97){ L.pat = Math.random() < .5 ? 'tabby' : 'solid'; L.coat = pick(['orange', DARK_COATS.includes(A.coat) ? A.coat : DARK_COATS.includes(B.coat) ? B.coat : 'black']); }

  return L;
}

function partySong(){
  const words = ['祝你生日快乐','祝你生日快乐','祝你生日快乐喵','祝你生日快乐'], beat = .4, seq = [], lines = words.map(w=>[...w]);
  let at = 0, k = 0;
  lines.forEach((ln, li)=>ln.forEach((ch, pos)=>{ const [m, b] = HB[k++]; seq.push({ch, m, dur:b*beat, at, line:li, pos}); at += b*beat; }));
  return {title:'生日快乐歌', seq, lines, beat, total:at, genre:GENRES.pop};
}
function songSeq(song, d){
  const g = GENRES[song.genre] || GENRES.pop, beat = 60/g.bpm;
  const title = fillLyrics(song.title, d);
  const lines = fillLyrics(song.lyrics, d).split('\n').map(l=>[...l].filter(c=>!/[\s，。、！？,.!?~～…“”"']/.test(c)).slice(0,14)).filter(l=>l.length).slice(0,6);
  let seed = [...title].reduce((a,c)=>(a*31 + c.charCodeAt(0))>>>0, 7);
  const sr = ()=>{ seed = (seed*1103515245 + 12345)>>>0; return seed/4294967296; };
  const seq = []; let at = 0, idx = 3;
  lines.forEach((ln, li)=>{
    ln.forEach((ch, pos)=>{
      const last = pos===ln.length-1;
      idx = clamp(idx + Math.round((sr()-.5)*4), 0, g.scale.length-1);
      const dur = beat * (last ? 2 : sr() < .25 ? 1.5 : 1) * (song.genre==='rap' ? .7 : 1);
      seq.push({ch, m:60 + g.scale[last ? (li%2 ? 0 : 4) : idx], dur, at, line:li, pos}); at += dur;
    });
    at += beat;
  });
  return {title, seq, lines, beat, total:at, genre:g};
}

/* ---------------- birth: kittens are born in a cardboard box ---------------- */
let birth = null; const birthQueue = [];
// a cardboard box: kittens are born in one, and cats can't walk past one without climbing in
function buildCardboardBox(sc=1){
  const g = new T.Group(), K = M('#C8955A'), Kd = M('#A87442'), w = .9*sc, h = .62*sc;
  g.add(mesh(G.box(w, .04, w), Kd, 0, .02, 0));
  [[0, w/2, 0],[0, -w/2, 0],[w/2, 0, Math.PI/2],[-w/2, 0, Math.PI/2]].forEach(([x, z, ry])=>{ const side = mesh(G.box(w, h, .05), K, x, h/2, z); side.rotation.y = ry; g.add(side); });
  const flaps = [[0, w/2, 0, 1],[0, -w/2, 0, -1],[w/2, 0, Math.PI/2, -1],[-w/2, 0, Math.PI/2, 1]].map(([x, z, ry, sgn], i)=>{
    const f = new T.Group(); f.position.set(x, h, z); f.rotation.y = ry; const fm = mesh(G.box(w*.98, .03, w*.42), i%2 ? Kd : K, 0, 0, sgn*w*.21); f.add(fm); f.rotation.x = sgn*-(.55 + i*.12); g.add(f); return f; });
  g.add(mesh(G.box(w*.3, .012, .12*sc), M('#E8D9B8'), 0, h*.62, w/2 + .03));
  g.userData = {flaps, h};
  return g;
}
function queueBirth(a, b, kids){ kids.forEach(k=>{ k.state = 'script'; k.dest = null; k.p.root.visible = false; }); birthQueue.push({a, b, kid:kids[0], kids}); }
function birthBusy(r){ return (!!birth && (birth.a===r || birth.b===r || birth.kids.includes(r))) || birthQueue.some(q=>q.kids.includes(r)); }
function startBirth(q){
  const {a, b, kids} = q;
  if(!byId(a.d.id) || !byId(b.d.id)){ kids.forEach(k=>{ k.state = 'idle'; k.p.root.visible = true; }); return; }
  if(mode==='room') leaveRoom(); if(selected) closeSheet();
  [a,b].forEach(castScript);
  const door = doorPoint(a.d.slot), d = Math.hypot(door.x, door.z) || 1, ux = -door.x/d, uz = -door.z/d, px = -uz, pz = ux;
  const L = new T.Vector3(door.x + ux*2.6, 0, door.z + uz*2.6);
  // mum settles by the box, dad paces next to it
  a.dest = new T.Vector3(L.x - px*1.2 - ux*.2, 0, L.z - pz*1.2 - uz*.2); b.dest = new T.Vector3(L.x + px*1.2 - ux*.2, 0, L.z + pz*1.2 - uz*.2);
  a.facePos = L.clone(); b.facePos = L.clone();
  kids.forEach((k, i)=>{ k.p.root.position.copy(L); k.p.root.visible = false; });
  const box = buildCardboardBox(1.25); box.position.copy(L); box.scale.setScalar(.01); box.rotation.y = Math.atan2(ux, uz); scene.add(box);
  birth = {a, b, kid:kids[0], kids, L, box, ux, uz, px, pz, stage:0, t:0, out:0};
  cam.goal.set(L.x, 1.6, L.z); cam.distGoal = 15; cam.pitchGoal = .42; cam.yawGoal = Math.atan2(ux, uz);
  musicHold = true;
  toast(`📦 ${a.d.name} 找了一个软软的纸箱……`, 'pink');
}
function updateBirth(dt, t){
  if(!birth){ if(birthQueue.length && !ev && !show && !isNight() && mode==='island') startBirth(birthQueue.shift()); return; }
  const B = birth, bx = B.box; B.t += dt;
  if(B.stage===0){ // the box pops up while the parents gather
    const k = Math.min(1, B.t/.7); bx.scale.setScalar(Math.max(.01, 1 + Math.sin(k*Math.PI)*.15*(1-k)) * (k < 1 ? k : 1));
    if(k >= 1 && (!B.a.dest && !B.b.dest || B.t > 7)){
      [B.a,B.b].forEach(x=>{ if(x.dest){ x.p.root.position.copy(x.dest); x.dest = null; } x.pose = 'sit'; x.scriptBubble = '😮'; });
      B.stage = 1; B.t = 0; toast('纸箱里传来细细的叫声……');
    }
  } else if(B.stage===1){ // the box wiggles and squeaks
    bx.rotation.z = Math.sin(t*14)*.05*(1 - B.t/2.6); bx.userData.flaps.forEach((f,i)=>f.rotation.z = Math.sin(t*10 + i)*.06);
    if(Math.random() < dt*3) meow({pitch:1.9, kitten:true}, '喵', 'calm');
    if(B.t > 2.6){ B.stage = 2; B.t = 0; bx.rotation.z = 0; [B.a,B.b].forEach(x=>{ x.pose = 'happy'; x.scriptBubble = '💖'; x.d.mood = 100; }); sfx.happy();
      [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.06,.5 + i*.18));
      const names = B.kids.map(k=>k.d.name).join('、');
      toast(`🐾 ${B.kids.length} 只小猫出生啦：${names}！`, 'pink'); setTimeout(()=>autoPhoto(`🐾 小猫 ${names} 出生啦`), 2200); }
  } else if(B.stage===2){ // kittens hop out one by one
    const per = .7;
    B.kids.forEach((k, i)=>{
      const kt = B.t - i*per; if(kt < 0) return;
      if(!k.p.root.visible){ k.p.root.visible = true; k.scriptBubble = '🍼'; burst(scene, B.L.clone().setY(1), '✨', 8, .8); meow({pitch:2, kitten:true}, '喵~', 'happy'); }
      const j = Math.min(1, kt/.6), side = (i - (B.kids.length-1)/2)*.9;
      const to = new T.Vector3(B.L.x + B.ux*1.4 + B.px*side, 0, B.L.z + B.uz*1.4 + B.pz*side);
      k.p.root.position.lerpVectors(B.L, to, j); k.p.root.position.y = Math.sin(j*Math.PI)*.9 + (1-j)*.3;
      k.p.root.scale.setScalar(kidScale(k.d)*(.4 + .6*j)); k.p.root.rotation.y = Math.atan2(B.ux, B.uz);
    });
    if(B.t > B.kids.length*per + 3) endBirth();
  }
}
function endBirth(){
  const B = birth; if(!B) return;
  scene.remove(B.box);
  [B.a,B.b,...B.kids].forEach(x=>{ x.state = 'idle'; x.timer = rand(1,2.5); x.pose = null; x.scriptBubble = null; x.face = null; x.facePos = null; x.dest = null; });
  B.kids.forEach(k=>{ k.p.root.scale.setScalar(kidScale(k.d)); k.p.root.position.y = 0; });
  birth = null; musicHold = false; cam.distGoal = null; cam.goal.y = 0; save();
  logNews(`🐾 ${B.a.d.name} 和 ${B.b.d.name} 家的纸箱里出生了 ${B.kids.length} 只小猫`);
  nameBaby(B.kids, B.a, B.b);
}

/* =====================================================================
   SEASONS, WEATHER & HOLIDAYS
   ===================================================================== */
function dayOfYear(){ return ((S.day-1) % YEAR) + 1; }
const SEASONS = [
  {n:'春', e:'🌸', grass:'#8FD16A', leaf:['#5DBB63','#6FCB6A','#4FAE6B']},
  {n:'夏', e:'🌻', grass:'#79C653', leaf:['#3FA65A','#53B95A','#2F9650']},
  {n:'秋', e:'🍁', grass:'#BFC46A', leaf:['#E8A03A','#D9663A','#E8C24A']},
  {n:'冬', e:'⛄', grass:'#E6EEF4', leaf:['#D3E4EA','#BCD5DE','#E4EEF2']}
];
function seasonIdx(){ const d = dayOfYear(); return d <= 3 ? 0 : d <= 5 ? 1 : d <= 8 ? 2 : 3; }
const LEAF_MATS = ['#5DBB63','#6FCB6A','#4FAE6B'].map(c=>M(c)), GRASS_MAT = M('#8FD16A');
function applySeason(){
  const s = SEASONS[seasonIdx()];
  LEAF_MATS.forEach((m,i)=>m.color.set(s.leaf[i])); GRASS_MAT.color.set(s.grass);
  snowman.visible = seasonIdx()===3;
}
const snowman = new T.Group();
(function(){
  const W = M('#FFFFFF');
  snowman.add(mesh(G.sph(.6,16,12), W, 0,.55,0)); snowman.add(mesh(G.sph(.42,16,12), W, 0,1.35,0)); snowman.add(mesh(G.sph(.3,14,10), W, 0,1.95,0));
  const nose = mesh(G.cone(.06,.3,8), M('#FF9F1C'), 0,1.95,.38); nose.rotation.x = Math.PI/2; snowman.add(nose);
  [-1,1].forEach(s=>snowman.add(mesh(G.sph(.04,6,5), M('#2A2438'), s*.1,2.03,.26)));
  snowman.add(mesh(G.cyl(.22,.22,.3,14), M('#3B3355'), 0,2.3,0)); snowman.add(mesh(G.cyl(.32,.32,.04,14), M('#3B3355'), 0,2.16,0));
  const sc = new T.Mesh(new T.TorusGeometry(.33,.07,8,18), M('#FF5E6E')); sc.rotation.x = Math.PI/2; sc.position.y = 1.68; snowman.add(sc);
  snowman.position.set(3.4,0,4.6); snowman.visible = false; scene.add(snowman);
})();
const WEATHER = {sunny:{n:'晴',e:'☀️'}, cloudy:{n:'多云',e:'⛅'}, rain:{n:'下雨',e:'🌧️'}, snow:{n:'下雪',e:'❄️'}};
function pickWeather(){
  const s = seasonIdx(), r = Math.random();
  if(s===3) return r < .45 ? 'snow' : r < .8 ? 'sunny' : 'cloudy';

    const t = pa.includes(o.d.id) ? (gOf(o)==='f' ? '♀ 猫妈妈' : '♂ 猫爸爸') : pb.includes(a.d.id) ? (gOf(o)==='f' ? '♀ 女儿' : '♂ 儿子') : (gOf(o)==='f' ? '♀ 姐妹' : '♂ 兄弟');
    return {k:'fam', t, c:'#F2B705', w:4, pri:5, v}; }
  if(fight) return {k:'fight', t:'💢 哈气中', c:'#6B5B7B', w:3, dash:'7 6', pri:4, v};

  const legend = [['#FF5E8A','恋人/夫妻'],['#F2B705','家人'],['#FF7A9A','好朋友'],['#7CCBA8','朋友'],['#6B5B7B','哈气中']].map(([c,t])=>`<span class="lk" style="border-color:${c}"><span style="color:${c}">●</span> ${t}</span>`).join(' ');

const SHOP_N = {food:5, acc:4, cloth:5, furn:6};
function shopCat(tab){ return tab==='food' ? FOODS : tab==='acc' ? ACCS : tab==='cloth' ? OUTFITS : FURN; }
function restockShop(){
  const sh = {day:S.day, items:{}, stock:{}, special:null};

function shopPrice(tab, k){ const v = shopCat(tab)[k]; return S.shop && S.shop.special && S.shop.special.tab===tab && S.shop.special.key===k ? Math.round(v.p*.6) : v.p; }

function partyNow(){ return S.party && S.party.day===S.day && S.hour >= 18 && S.hour < 20.5; }
function partyMorning(extra){

  const hosts = residents.filter(r=>!r.d.kid && !r.d.isPlayer && residents.filter(o=>o!==r && (r.d.friends[o.d.id]||0) >= 40).length >= 2);

function partyHourly(prev){
  const P = S.party; if(!P || P.day !== S.day) return;
  const host = byId(P.host); if(!host) return;
  if(prev < 18 && S.hour >= 18){
    [host, ...P.guests.map(byId).filter(Boolean)].forEach(r=>{ if(inEvent(r) || r.state==='home') return; if(r.state==='chat') endChat(r); r.state = 'walk'; r.dest = doorPoint(host.d.slot); r.onArrive = r===host ? 'home' : 'visit'; r.visiting = host.d.id; r.target = null; });
    toast(`🎉 ${host.d.name} 家的派对开始啦，点${ta(host.d)}家看看！`, 'pink');
  }
  if(prev < 20.5 && S.hour >= 20.5){
    const guests = residents.filter(r=>r.state==='visit' && r.visiting===host.d.id);
    guests.forEach(g=>{ g.state = 'idle'; g.timer = rand(.5,2); g.p.root.position.copy(doorPoint(host.d.slot)); g.p.root.visible = true; addFriend(host, g, 5); });
    for(let i=0;i<guests.length;i++) for(let j=i+1;j<guests.length;j++) addFriend(guests[i], guests[j], 3);
    if(guests.length) logNews(`🎉 ${host.d.name} 家的派对很热闹，${guests.map(g=>g.d.name).join('、')} 都去了`);
    if(mode==='room' && roomRes===host){ buildRoomKeepChar(); renderRoomBar(); }
  }
}

const DESIGN_PAL = ['transparent','#2A2438','#FFFFFF','#FF5E6E','#FF9F43','#FFE066','#7ED957','#3FA65A','#6FA8FF','#3A5BD9','#B48CFF','#FF8FB1','#8A5A3C','#C9C9D6','#5CC9A7','#F2C57C'];
function designById(id){ return (S.designs||[]).find(x=>x.id===id); }
function designCanvas(ds, px){
  const c = document.createElement('canvas'); c.width = c.height = 16*px; const g = c.getContext('2d');
  for(let i=0;i<256;i++){ const k = parseInt(ds.px[i],16); if(!k) continue; g.fillStyle = DESIGN_PAL[k]; g.fillRect((i%16)*px, Math.floor(i/16)*px, px, px); }
  return c;
}
function designPatterns(){ return (S.designs||[]).map(ds=>({id:'d:'+ds.id, n:ds.name})); }
function invalidateDesign(id){
  const tag = 'd:' + id;
  Object.keys(texCache2).forEach(k=>{ if(k.includes(tag)) delete texCache2[k]; });
  Object.keys(matCache).forEach(k=>{ if(k.includes(tag)) delete matCache[k]; });
  Object.keys(thumbCache).forEach(k=>{ if(k.includes(tag)) delete thumbCache[k]; });
  posterTexCache[id] = null;
  residents.forEach(r=>{ if(r.d.look.pattern===tag) rebuildChar(r); });
}
const posterTexCache = {};
function posterTex(id){ if(posterTexCache[id]) return posterTexCache[id]; const ds = designById(id); if(!ds) return null; const t = new T.CanvasTexture(designCanvas(ds, 16)); t.magFilter = T.NearestFilter; return posterTexCache[id] = t; }
function openDesigns(){

  openModal(modalHead('🎨 设计工坊') + `<p class="tip">画一张 16×16 的小图案，可以挂在猫咪家里当海报。最多保存 8 张。</p>
    <div class="grid-items">${list.map((ds,i)=>`<button class="toy item" data-dz="${i}"><img src="${designCanvas(ds,4).toDataURL()}" style="width:64px;height:64px;image-rendering:pixelated;border-radius:8px;background:#fff" alt="">${esc(ds.name)}</button>`).join('')}${list.length < 8 ? '<button class="toy item" data-dz="new"><span class="ic">➕</span>新的设计</button>' : ''}</div>`, b=>{

function openDesignEditor(ds){
  const draftD = ds ? {id:ds.id, name:ds.name, px:ds.px.split('')} : {id:'x'+Date.now().toString(36), name:'我的设计', px:Array(256).fill('0')};

  openModal(modalHead(ds ? '🎨 改设计' : '🎨 新的设计') + `
    <div class="name-row" style="margin-bottom:10px"><input class="text-in" id="dzName" maxlength="8" value="${esc(draftD.name)}"></div>
    <div class="dz-wrap"><div class="dz-grid" id="dzGrid">${draftD.px.map((k,i)=>`<i data-px="${i}" style="background:${k==='0' ? '' : DESIGN_PAL[parseInt(k,16)]}"></i>`).join('')}</div>
    <div class="dz-side"><div class="dz-pal">${DESIGN_PAL.map((c,i)=>`<button data-col="${i}" class="${i===col?'on':''}" style="background:${i ? c : 'repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px'}" aria-label="颜色 ${i}"></button>`).join('')}</div>
    <div class="row-btns"><button class="toy pill-btn" data-tool="pen">✏️ 画笔</button><button class="toy pill-btn" data-tool="fill">🪣 填充</button><button class="toy pill-btn" data-tool="clear">🧽 清空</button></div></div></div>
    <div class="row-btns" style="margin-top:12px"><button class="toy big-go" data-dzsave="1" style="flex:1">保存</button>${ds ? '<button class="toy pill-btn" data-dzdel="1">删除</button>' : ''}</div>`, b=>{
    if(!b){ return; }
    if(b.dataset.col){ col = +b.dataset.col; document.querySelectorAll('[data-col]').forEach(x=>x.classList.toggle('on', x===b)); if(tool==='clear') tool = 'pen'; }
    if(b.dataset.tool==='clear'){ draftD.px.fill('0'); document.querySelectorAll('[data-px]').forEach(x=>x.style.background=''); }
    else if(b.dataset.tool) tool = b.dataset.tool;
    if(b.dataset.dzsave){
      draftD.name = ($('#dzName').value || '我的设计').trim().slice(0,8);
      S.designs = S.designs || []; const out = {id:draftD.id, name:draftD.name, px:draftD.px.join('')}, idx = S.designs.findIndex(x=>x.id===draftD.id);
      if(idx >= 0) S.designs[idx] = out; else S.designs.push(out);
      invalidateDesign(out.id); save(); toast('🎨 设计保存好了！'); openDesigns();
    }
    if(b.dataset.dzdel){ S.designs = S.designs.filter(x=>x.id!==draftD.id); residents.forEach(r=>{ if(r.d.room && r.d.room.poster===draftD.id) r.d.room.poster = null; if(r.d.look.pattern==='d:'+draftD.id){ r.d.look.pattern = 'none'; rebuildChar(r); } }); invalidateDesign(draftD.id); save(); openDesigns(); }
  });
  const grid = $('#dzGrid');
  const paint = el=>{
    const i = +el.dataset.px; if(isNaN(i)) return; const k = col.toString(16);
    if(tool==='fill'){ const from = draftD.px[i]; if(from===k) return; const q = [i]; while(q.length){ const j = q.pop(); if(draftD.px[j]!==from) continue; draftD.px[j] = k; const x = j%16, y = Math.floor(j/16); if(x>0) q.push(j-1); if(x<15) q.push(j+1); if(y>0) q.push(j-16); if(y<15) q.push(j+16); } grid.querySelectorAll('[data-px]').forEach(c=>{ const v = draftD.px[+c.dataset.px]; c.style.background = v==='0' ? '' : DESIGN_PAL[parseInt(v,16)]; }); return; }
    draftD.px[i] = k; el.style.background = col ? DESIGN_PAL[col] : '';
  };
  grid.addEventListener('pointerdown', e=>{ down = true; grid.setPointerCapture(e.pointerId); const el = document.elementFromPoint(e.clientX, e.clientY); if(el && el.dataset && el.dataset.px) paint(el); });
  grid.addEventListener('pointermove', e=>{ if(!down || tool==='fill') return; const el = document.elementFromPoint(e.clientX, e.clientY); if(el && el.dataset && el.dataset.px) paint(el); });
  grid.addEventListener('pointerup', ()=>down = false);
}

  singer:{n:'成为喵星歌手', e:'🎤', goal:2, how:'在舞台上开 2 场喵喵演唱会', val:d=>stat(d,'concerts')},

  fashion:{n:'成为装扮达猫', e:'🎀', goal:4, how:'戴过 4 套不同的装扮', val:d=>(d.worn||[]).length},

function dreamOf(d){ return d.dream && LIFE_DREAMS[d.dream.id] ? d.dream : null; }
function giveDream(d){ if(d.isPlayer || d.kid) return; const used = d.dreamsDone || []; const ch = Object.keys(LIFE_DREAMS).filter(k=>!used.includes(k)); if(ch.length) d.dream = {id:pick(ch), since:S.day}; }
function checkDream(d){
  const dr = dreamOf(d); if(!dr || dr.done) return;
  const D = LIFE_DREAMS[dr.id]; if(D.val(d) < D.goal) return;
  dr.done = true; d.dreamsDone = (d.dreamsDone||[]).concat(dr.id);
  const r = byId(d.id); addCoins(100);
  toast(`🌟 ${d.name} 实现了梦想：${D.n}！+100 金币`, 'gold'); logNews(`🌟 ${d.name} 实现了人生梦想：${D.n}`);

  sfx.happy(); milestone('dream');
}
function dreamHtml(d){
  const dr = dreamOf(d); if(!dr) return '';
  const D = LIFE_DREAMS[dr.id], v = Math.min(D.goal, D.val(d));
  return `<div class="dreambox"><b>${D.e} 梦想：${D.n}</b>${dr.done ? '<span class="dream-done">✨ 已经实现啦！</span>' : `<span class="dream-how">${D.how}（${v}/${D.goal}）</span><div class="bar"><i style="width:${v/D.goal*100}%;background:var(--sun)"></i></div>`}</div>`;
}

function openFamilyTree(){
  const P = r=>`<div class="ft-person"><img src="${portrait(r.d)}" alt=""><span>${r.d.isPlayer?'⭐':''}${esc(r.d.name)}</span><small>${r.d.kid ? kidTag(r.d) : (r.d.age ? r.d.age + '岁' : '')}</small></div>`;
  const kidsOf2 = (a,b)=>residents.filter(k=>k.d.parents && k.d.parents.includes(a.d.id) && (!b || k.d.parents.includes(b.d.id)));
  const seen = new Set();
  const unit = r=>{ // a person, their spouse/partner and their children, recursively
    if(seen.has(r)) return ''; seen.add(r);
    const pt = r.d.partner && byId(r.d.partner); if(pt) seen.add(pt);
    const kids = residents.filter(k=>k.d.parents && (k.d.parents.includes(r.d.id) || (pt && k.d.parents.includes(pt.d.id))));
    return `<div class="ft-unit"><div class="ft-couple">${P(r)}${pt ? `<span class="ft-link">${r.d.pType==='spouse' ? '💍' : '💕'}</span>${P(pt)}` : ''}</div>${kids.length ? `<div class="ft-kids">${kids.map(unit).join('')}</div>` : ''}</div>`;
  };
  const roots = residents.filter(r=>!(r.d.parents && r.d.parents.some(id=>byId(id))));
  const families = roots.filter(r=>r.d.partner || residents.some(k=>k.d.parents && k.d.parents.includes(r.d.id))).map(unit).filter(Boolean);
  const singles = roots.filter(r=>!seen.has(r));
  openModal(modalHead('👪 族谱') + `<p class="tip">从上到下是一代一代：💍 是夫妻，💕 是恋人，下面一层是它们的小猫。</p>
    ${families.length ? `<div class="ft">${families.join('')}</div>` : '<p class="empty">岛上还没有组成家庭的猫咪。</p>'}
    ${singles.length ? `<div class="sec">还没成家的猫咪</div><div class="ft-singles">${singles.map(P).join('')}</div>` : ''}`);
}

function startTrip(r){

function tripMorning(extra){

function postcard(d, dest){
  const img = new Image();
  img.onload = img.onerror = ()=>{
    try{
      const c = document.createElement('canvas'); c.width = 640; c.height = 456; const g = c.getContext('2d');
      const gr = g.createLinearGradient(0,0,0,400); gr.addColorStop(0, dest.bg[0]); gr.addColorStop(1, dest.bg[1]); g.fillStyle = gr; g.fillRect(0,0,640,400);
      g.font = '210px "Segoe UI Emoji","Apple Color Emoji",sans-serif'; g.textAlign = 'center'; g.fillText(dest.e, 420, 300);
      if(img.width){ g.save(); g.beginPath(); g.arc(170, 230, 110, 0, Math.PI*2); g.clip(); g.drawImage(img, 60, 120, 220, 220); g.restore(); g.lineWidth = 8; g.strokeStyle = '#FFFFFF'; g.beginPath(); g.arc(170,230,110,0,Math.PI*2); g.stroke(); }
      g.fillStyle = '#FFFBF2'; g.fillRect(0,400,640,56); g.fillStyle = '#D95466'; g.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign = 'left'; g.fillText(`✈️ ${d.name} 在${dest.n}`, 18, 437);
      g.fillStyle = '#6E6788'; g.font = '16px "PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign = 'right'; g.fillText(`猫猫小岛 · 第 ${S.day} 天`, 622, 437);
      const ph = loadPhotos(); ph.unshift(c.toDataURL('image/jpeg', .75)); while(ph.length > 30) ph.pop();
      for(;;){ try{ localStorage.setItem('mm_photos', JSON.stringify(ph)); break; }catch(e){ if(ph.length <= 1) break; ph.pop(); } }
    }catch(e){}
  };
  img.src = portrait(d);
}

function loadScript(src){ return new Promise((ok, no)=>{ const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
async function qrDataURL(text){

function genMel(seed, scale, root, rest){
  let s = seed; const r = ()=>{ s = (s*16807) % 2147483647; return (s-1)/2147483646; };
  const out = []; let idx = 3;
  for(let i=0;i<64;i++){ if(i%8===7 || r() < rest){ out.push(0); continue; } idx = clamp(idx + Math.round((r()-.5)*3.2), 0, scale.length-1); out.push(root + scale[idx]); }
  return out;
}

  return Math.random() < .55 ? pick(life) : pick(ASK_KINDS);
}

    if(d.want && d.want.type==='ask') fulfil(r, coins); else addCoins(coins);

function homeSlot(r){ const p = r.d.moveTo && byId(r.d.moveTo); return p && p.d.partner===r.d.id && r.d.partner===p.d.id ? p.d.slot : r.d.slot; }
function divorce(a, b){
  a.d.partner = b.d.partner = null; a.d.pType = b.d.pType = null; a.d.moveTo = b.d.moveTo = null; a.d.ex = b.d.id; b.d.ex = a.d.id;
  [a,b].forEach(x=>{ x.d.mood = clamp(x.d.mood-30,0,100); x.angryT = 4; if(hasSocialWant(x)) x.d.want = null; });
  addFriend(a, b, -20); toast(`💔 ${a.d.name} 和 ${b.d.name} 离婚了……`); logNews(`💔 ${a.d.name} 和 ${b.d.name} 哈气哈得太凶，最后离婚了`); save();
}
function dramaMorning(extra){
  const adults = residents.filter(r=>!r.d.kid && !r.d.isPlayer && r.state!=='away');
  adults.forEach(r=>{
    const d = r.d;
    // the crush has found someone else
    if(d.crush){ const o = byId(d.crush.id); if(!o || o.d.partner){ if(o) extra.push(`💧 ${d.name} 暗恋了 ${o.d.name} 好久，还没去蹭蹭，${o.d.name} 就有对象了……`); d.crush = null; d.mood = clamp(d.mood-20,0,100); return; } }
    if(d.partner || hasSocialWant(r)) return;
    // old flames
    const ex = d.ex && byId(d.ex);
    if(ex && canRomance(r, ex) && (d.friends[ex.d.id]||0) >= 60 && Math.random() < .12){ d.want = {type:'love', with:ex.d.id}; extra.push(`💞 ${d.name} 最近总是和前任 ${ex.d.name} 待在一起……难道要旧情复燃？`); return; }
    // secret crush: grows quietly, then they decide to confess
    if(d.crush && S.day - d.crush.since >= 3 && Math.random() < .35){ const o = byId(d.crush.id); d.want = {type:'love', with:o.d.id}; extra.push(`💌 ${d.name} 暗恋 ${o.d.name} 已经 ${S.day - d.crush.since} 天了，今天终于下定决心要表白！`); d.crush = null; return; }
    if(!d.crush && Math.random() < .1){ const o = residents.filter(x=>x!==r && canRomance(r,x) && x.d.id!==d.noCrush && (d.friends[x.d.id]||0) >= 40).sort((x,y)=>(d.friends[y.d.id]||0)-(d.friends[x.d.id]||0))[0]; if(o) d.crush = {id:o.d.id, since:S.day}; }
  });
  // kids pick up their parents' catchphrases, best friends rub off on each other
  residents.forEach(r=>{
    const d = r.d; if(d.isPlayer) return;
    if(d.kid && kidAge(d) >= 3 && Math.random() < .12){ const p = (d.parents||[]).map(byId).filter(x=>x && x.d.catch && x.d.catch!==d.catch)[0]; if(p){ d.catch = p.d.catch; d.catchFrom = p.d.id; extra.push(`🍼 ${d.name} 学会了${gOf(p)==='f' ? '猫妈妈' : '猫爸爸'} ${p.d.name} 的口头禅「${p.d.catch}」`); } return; }
    if(!d.kid && Math.random() < .03){ const o = residents.filter(x=>x!==r && !x.d.isPlayer && (d.friends[x.d.id]||0) >= 95 && x.d.catch && x.d.catch!==d.catch)[0]; if(o){ d.catch = o.d.catch; d.catchFrom = o.d.id; extra.push(`💬 ${d.name} 和 ${o.d.name} 天天待在一起，也开始说「${o.d.catch}」了`); } }
  });
  // residents in a good mood sometimes write their own songs
  residents.forEach(r=>{
    const d = r.d; if(d.isPlayer || (d.kid && kidAge(d) < 6) || d.mood < 60 || Math.random() > .05) return;
    const s = composeSong(r); d.songs = (d.songs||[]).concat(s).slice(-6);
    extra.push(`🎵 ${d.name} 自己喵了一首${GENRES[s.genre].n}《${s.title}》，去舞台听${ta(d)}唱吧`);
  });
}
function composeSong(r){
  const d = r.d, fr = residents.filter(o=>o!==r && (d.friends[o.d.id]||0) >= 40), f = fr.length ? pick(fr).d.name : '大家', pt = d.partner && byId(d.partner);
  const food = FOODS[d.fav] ? FOODS[d.fav].n : '小鱼干', sea = ['春天','夏天','秋天','冬天'][seasonIdx()];
  const titles = [`${sea}的${food}`, `给${f}的歌`, '小岛之歌', `${d.catch||'喵喵喵'}进行曲`, pt ? `我爱${pt.d.name}` : '一只猫的晚上', '纸箱里面'];
  const pool = [`${sea}来到小岛上`, `我最爱吃${food}`, `${f}是我的好朋友`, '海风吹呀吹', '今天也要晒太阳', `${d.catch||'喵喵喵'}${d.catch||'喵喵喵'}`, '星星眨眼睛', '一起去看海', '肚子咕咕叫', '尾巴摇呀摇', pt ? `${pt.d.name}你在哪里` : '谁来摸摸我', '明天也是好天气'];
  return {title:pick(titles), genre:pick(Object.keys(GENRES)), lyrics:shuffle(pool).slice(0,4).join('\n')};
}

function startPlay(P, actors){
  if(busy()) return;
  if(mode==='room') leaveRoom(); if(selected) closeSheet();
  const aud = freeCast(actors).slice(0,6), all = [...actors, ...aud];
  all.forEach(castScript);
  const L = LOCS.stage, dd = Math.hypot(L.x,L.z), ux = -L.x/dd, uz = -L.z/dd, px = -uz, pz = ux, spot = stageSpot(), front = new T.Vector3(L.x + ux*6, 0, L.z + uz*6);
  actors.forEach((x,i)=>{ x.dest = spot.clone().add(new T.Vector3(px*(i-1)*1.25, 0, pz*(i-1)*1.25)); x.facePos = front.clone(); });
  aud.forEach((x,i)=>{ const k = aud.length > 1 ? i/(aud.length-1) - .5 : 0, row = i%2; x.dest = new T.Vector3(L.x + ux*(4.3+row*1.1) + px*k*4.4, 0, L.z + uz*(4.3+row*1.1) + pz*k*4.4); x.facePos = spot.clone(); });
  let li = 0, lt = 0, ad = 0;
  show = {type:'play', host:actors[0], cast:all, stage:0, t:0,
    begin(){ actors.forEach((x,i)=>{ x.p.root.position.y = .35; x.scriptBubble = null; }); aud.forEach(x=>{ x.pose = 'chat'; x.scriptBubble = '🍿'; }); toast(`🎭 猫猫话剧《${P.n}》开演啦！`, 'gold'); lt = .5; },
    tick(dt){
      lt -= dt; if(lt > 0) return;
      if(li >= P.lines.length){ this.finish(); return; }
      const [ri9, line] = P.lines[li++], x = actors[ri9], d = x.d, funny = d.pers==='funny' ? .3 : .12;
      let text = line, lol = false;
      if(Math.random() < funny){ text = pick(ADLIBS).replace(/\{catch\}/g, d.catch||'喵~').replace(/\{food\}/g, FOODS[d.fav] ? FOODS[d.fav].n : '小鱼干'); lol = true; ad++; }
      actors.forEach(a=>{ a.pose = null; a.scriptBubble = null; }); x.pose = 'chat'; x.scriptBubble = lol ? '😜' : '💬';
      const el = $('#karaoke'); el.innerHTML = `<small>🎭 ${esc(P.n)} · ${esc(P.roles[ri9])}</small><span class="on">${esc(d.name)}：${esc(text)}</span>`; el.hidden = false;
      speakWith(d.voice, text); sfx.chat(d.voice);
      if(lol){ aud.forEach(a=>{ a.scriptBubble = '🤣'; a.pose = 'happy'; }); setTimeout(()=>aud.forEach(a=>{ if(show && show.type==='play'){ a.scriptBubble = '🍿'; a.pose = 'chat'; } }), 1500); }
      lt = 1.4 + text.length*.17;
    },
    finish(){
      this.stage = 2; this.t = 0; karaoke(null, -1);
      const coins = 40 + aud.length*5 + ad*10;
      actors.forEach(a=>{ a.pose = 'happy'; a.scriptBubble = '🙇'; a.d.mood = clamp(a.d.mood+20,0,100); actors.forEach(b=>{ if(a!==b) addFriend(a, b, 3); }); });
      aud.forEach(a=>{ a.pose = 'happy'; a.scriptBubble = '👏'; a.d.mood = clamp(a.d.mood+10,0,100); });
      addCoins(coins); applause(); burst(scene, actors[1].p.root.position.clone().setY(3), '🌹', 8, 1.2); task('play');
      toast(ad ? `🤣 猫观众笑翻了！《${P.n}》谢幕 +${coins} 金币` : `👏 《${P.n}》完美谢幕！+${coins} 金币`, 'gold');
      logNews(`🎭 ${actors.map(a=>a.d.name).join('、')} 在舞台上演了猫猫话剧《${P.n}》${ad ? `，${pick(actors).d.name} 即兴发挥笑翻全场` : ''}`);
      setTimeout(()=>autoPhoto(`🎭 猫猫话剧《${P.n}》`), 600);
    }};
  cam.goal.set(L.x + ux*2.2, 0, L.z + uz*2.2); cam.distGoal = 15; cam.yawGoal = Math.atan2(ux, uz); cam.pitchGoal = .9;
}
function updateShow2(dt){
  const sh = show;
  if(sh.stage===0){
    if(!sh.cast.some(x=>x.dest) || sh.t > 9){ sh.cast.forEach(x=>{ if(x.dest){ x.p.root.position.copy(x.dest); x.dest = null; } }); sh.stage = 1; sh.t = 0; musicHold = true; sh.begin(); }
  } else if(sh.stage===1) sh.tick(dt);
  else if(sh.stage===2 && sh.t > 3.4) endShow();
}

function buildArch(){

  const arc = new T.Mesh(new T.TorusGeometry(1.1,.1,8,24,Math.PI), M('#FFB3C8')); arc.position.y = 2.4; g.add(arc);
  for(let i=0;i<9;i++){ const a = i/8*Math.PI; g.add(mesh(G.sph(.16,8,6), M(['#FF7A8A','#FFFFFF','#FFC94D'][i%3]), Math.cos(a)*1.1, 2.4 + Math.sin(a)*1.1, .05, false)); }

}

function runRace(sel, fav){
  const big = isSportsDay();

    if(!$('#raceCv')){ stopGame(); return; }
    const dt = Math.min(.05, (now-last)/1000); last = now; const t = (now-t0)/1000;

    run.forEach((u,i)=>{ const y = 30 + i*46; g.fillStyle = i%2 ? '#E8875E' : '#F09A70'; g.fillRect(0, y, 340, 40); });
    g.fillStyle = '#FFFFFF'; for(let i=0;i<run.length*4;i++) g.fillRect(FIN + 18 + (i%2)*6, 30 + i*11.5, 6, 11.5);
    g.font = 'bold 14px sans-serif'; g.fillStyle = '#3B3355'; g.textAlign = 'left'; g.fillText(t < 1.5 ? '预备……' : '冲啊喵！', 8, 20);

      const y = 50 + i*46, bob = Math.abs(Math.sin(t*12 + i))*4;
      g.save(); g.beginPath(); g.arc(20 + u.x, y - bob, 16, 0, Math.PI*2); g.fillStyle = '#FFF6E6'; g.fill(); g.clip(); if(imgs[i].width) g.drawImage(imgs[i], 20 + u.x - 19, y - bob - 19, 38, 38); g.restore();
      g.lineWidth = 2.5; g.strokeStyle = u.r===fav ? '#FF7A8A' : '#FFFFFF'; g.beginPath(); g.arc(20 + u.x, y - bob, 16, 0, Math.PI*2); g.stroke();
    });

      run.forEach(u=>{ u.r.d.mood = clamp(u.r.d.mood + (u===win ? 20 : 8), 0, 100); u.r.d.full = clamp(u.r.d.full - 10, 0, 100); run.forEach(o=>{ if(o!==u) addFriend(u.r, o.r, 3); }); });

      }

const RETIRE_AGE = 65, OLD_AGE = 50;

  if(d.kid || !d.age || d.age < 50) return;
  if(d.look.cat){ d.look.gray = Math.round(clamp((d.age-50)/20, 0, 1)*10)/10; return; }
  d.look.origHair = d.look.origHair || d.look.hairColor;

/* ---------------- time of day ---------------- */
function isNight(){ return S.hour >= 21 || S.hour < 6; }
function isFestival(){ return S.day % 3 === 0 || (holiday() && holiday().id==='summer'); }
function festivalNow(){ return isFestival() && S.hour >= 19.5 && S.hour < 21; }
const KEYS = [[0,SKY_NIGHT,.1,.25],[5,SKY_NIGHT,.1,.25],[6.5,SKY_DUSK,.55,.5],[8,SKY_DAY,.75,.65],[17,SKY_DAY,.75,.65],[19,SKY_DUSK,.5,.5],[20.5,SKY_NIGHT,.12,.28],[24,SKY_NIGHT,.1,.25]];
const tmpC = new T.Color();
function applySky(){
  const h = S.hour; let i=0; while(i<KEYS.length-2 && h>=KEYS[i+1][0]) i++;
  const a = KEYS[i], b = KEYS[i+1], k = (h-a[0])/(b[0]-a[0]);
  tmpC.copy(a[1]).lerp(b[1], k); scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  sun.intensity = lerp(a[2],b[2],k); hemi.intensity = lerp(a[3],b[3],k);
  const night = 1 - clamp((sun.intensity-.12)/.5,0,1);
  stars.material.opacity = night;
  windowMat.color.set(night > .5 ? '#FFD27A' : '#BFE8FF');
  const ang = (h-6)/15*Math.PI; sun.position.set(Math.cos(ang)*30, Math.max(8,Math.sin(ang)*35), 15);
  weatherSky();
}
let lastHourInt = null;
function tickTime(dt){
  const prev = S.hour;
  S.hour += dt * (isNight() ? .05 : festivalNow() ? .04 : .1); // 1 game hour = 10s day, 20s night, 25s during fireworks
  if(S.hour >= 24) S.hour -= 24;
  if(prev < 6 && S.hour >= 6) morning();
  if(prev < 19.5 && S.hour >= 19.5 && isFestival()){ toast('烟花大会开始啦！猫咪们都来广场啦','gold'); residents.forEach(r=>{ if(r.state==='idle'||r.state==='walk'){ r.state='idle'; r.timer=rand(0,1.5); r.watching=false; } }); }
  if(prev < 20 && S.hour >= 20 && S.visitor){ toast(`🚢 流浪猫 ${S.visitor.d.name} 搭渔船离开了小岛`); logNews(`🚢 流浪猫 ${S.visitor.d.name} 离开了小岛，继续流浪去了`); S.visitor = null; despawnVisitor(); save(); }

  const night = isNight(); $('#bSleep').hidden = !night || mode!=='island';
  const hh = Math.floor(S.hour), mm = Math.floor((S.hour-hh)*60/10)*10;
  const per = hh<6?'深夜':hh<11?'早上':hh<13?'中午':hh<18?'下午':hh<21?'傍晚':'晚上';
  $('#clock').textContent = `第${S.day}天 ${SEASONS[seasonIdx()].e}${WEATHER[weather()].e}${holiday() ? holiday().e : ''} · ${per} ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  partyHourly(prev);
